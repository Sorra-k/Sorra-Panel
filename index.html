<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SORRA Works</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <img id="site-logo" src="https://via.placeholder.com/50" alt="SORRA Works Logo">
            <h1 id="site-title">SORRA Works</h1>
        </div>
        <nav>
            <button onclick="switchTab('manga')">Truyện Tranh (Manga)</button>
            <button onclick="switchTab('pinterest')">Góc Art (Pinterest)</button>
            <button id="admin-btn" onclick="toggleAdminPanel()">Admin Panel</button>
        </nav>
    </header>

    <section id="admin-panel" class="hidden">
        <h2>Bảng Quản Trị Admin</h2>
        <div id="login-form">
            <h3>Đăng nhập Admin</h3>
            <input type="email" id="admin-email" placeholder="Email Admin">
            <input type="password" id="admin-pass" placeholder="Mật khẩu">
            <button onclick="loginAdmin()">Đăng nhập</button>
        </div>

        <div id="upload-form" class="hidden">
            <h3>Đăng Nội Dung Mới</h3>
            <select id="post-type">
                <option value="manga">Đăng Truyện (MangaDex Style)</option>
                <option value="art">Đăng Ảnh (Pinterest Style)</option>
            </select>
            <input type="text" id="post-title" placeholder="Tiêu đề">
            <textarea id="post-desc" placeholder="Mô tả chi tiết..."></textarea>
            <input type="text" id="post-image-url" placeholder="Link ảnh/bìa (URL)">
            <button onclick="createPost()">Đăng bài</button>
            <button onclick="logoutAdmin()">Đăng xuất</button>
        </div>
    </section>

    <main id="manga-section" class="tab-content">
        <h2>Danh Sách Truyện</h2>
        <div class="manga-grid" id="manga-container">
            </div>
    </main>

    <main id="pinterest-section" class="tab-content hidden">
        <h2>Thư Viện Tranh Art</h2>
        <div class="pin-grid" id="pinterest-container">
            </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
