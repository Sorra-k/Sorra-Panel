<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manga Của Tôi</title>
  <style>
    /* Nền đen toàn bộ trang web */
    body {
      font-family: Arial, sans-serif;
      background-color: #111111;
      color: #ffffff;
      margin: 0;
      padding: 0;
    }

    /* Thanh tiêu đề phía trên */
    header {
      padding: 20px;
      text-align: center;
      background-color: #222222;
      border-bottom: 1px solid #333333;
    }

    /* Khung chứa nội dung manga */
    .chapter {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background-color: #1e1e1e;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    /* Đảm bảo ảnh tự co giãn đẹp mắt trên điện thoại & máy tính */
    .chapter img {
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: 15px;
      border-radius: 8px;
    }

    /* Khung bình luận */
    .comments-section {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #333333;
    }
  </style>
</head>
<body>

  <header>
    <h1>Manga Tự Vẽ</h1>
  </header>

  <div class="chapter">
    <h2>Chapter 1</h2>

    <img src="IMG_1903 (1).PNG" alt="Trang 1">

    <div class="comments-section">
      <h3>Bình Luận</h3>
      
      <div id="giscus"></div>
    </div>
  </div>

</body>
</html>
