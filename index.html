<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SORRA WORKS // RETRO PLATFORM</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    /* RETRO THEME STYLES */
    :root {
      --bg-primary: #0a0a0f;
      --bg-card: #12121a;
      --text-main: #00ffcc;
      --text-muted: #ff71ce;
      --accent: #ff007f;
      --border: #00ffcc;
      --font-retro: 'Courier New', Courier, monospace;
    }

    [data-theme="light"] {
      --bg-primary: #f4ebd9;
      --bg-card: #fffcf0;
      --text-main: #111111;
      --text-muted: #d9534f;
      --accent: #d9534f;
      --border: #111111;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-retro);
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.5;
    }

    /* HEADER RETRO */
    header {
      background: var(--bg-card);
      border-bottom: 3px solid var(--border);
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 0px var(--border);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .site-logo {
      width: 40px;
      height: 40px;
      border: 2px solid var(--border);
      object-fit: cover;
    }

    .logo-text {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent);
      text-transform: uppercase;
      text-shadow: 2px 2px var(--border);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-retro {
      padding: 8px 14px;
      background: var(--bg-card);
      color: var(--text-main);
      border: 2px solid var(--border);
      font-family: var(--font-retro);
      font-weight: bold;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--border);
      transition: all 0.1s;
    }

    .btn-retro:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--border);
    }

    /* CONTAINER */
    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 15px;
    }

    /* ADMIN PANEL */
    .sorra-panel {
      background: var(--bg-card);
      border: 3px dashed var(--accent);
      padding: 20px;
      margin-bottom: 30px;
      display: none;
    }

    .sorra-panel h3 {
      color: var(--accent);
      margin-bottom: 10px;
    }

    /* FEED STYLE LIKE X (TWITTER) */
    .post-card {
      background: var(--bg-card);
      border: 2px solid var(--border);
      box-shadow: 5px 5px 0px var(--border);
      padding: 20px;
      margin-bottom: 35px;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .author-avatar {
      width: 50px;
      height: 50px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      object-fit: cover;
    }

    .post-author-info h4 {
      color: var(--text-main);
      font-size: 1.1rem;
    }

    .post-author-info span {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .post-content {
      margin-bottom: 15px;
    }

    .manga-page-img {
      width: 100%;
      border: 2px solid var(--border);
      margin-top: 10px;
      display: block;
    }

    /* LIKE & REACTION BAR */
    .action-bar {
      display: flex;
      gap: 20px;
      padding: 10px 0;
      border-top: 1px dashed var(--border);
      border-bottom: 1px dashed var(--border);
      margin: 15px 0;
    }

    .like-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-family: var(--font-retro);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1rem;
    }

    .like-btn.active {
      color: var(--accent);
    }

    /* COMMENTS UNDER EACH PAGE/CHAPTER */
    .comments-container {
      margin-top: 15px;
      background: rgba(0, 0, 0, 0.2);
      padding: 15px;
      border: 1px solid var(--border);
    }

    .comment-list {
      list-style: none;
      margin-bottom: 15px;
    }

    .comment-item {
      padding: 6px 0;
      border-bottom: 1px dotted var(--border);
      font-size: 0.9rem;
    }

    .comment-item strong {
      color: var(--accent);
    }

    .comment-box {
      display: flex;
      gap: 8px;
    }

    .comment-input {
      flex: 1;
      padding: 8px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-family: var(--font-retro);
    }

    footer {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 2px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="IMG_1903 (1).PNG" id="siteLogoImg" class="site-logo" alt="Logo">
      <span class="logo-text">SORRA_WORKS_v1.0</span>
    </div>

    <div class="nav-actions">
      <button class="btn-retro" onclick="toggleTheme()"><i class="fa-solid fa-circle-half-stroke"></i> THEME</button>
      <button class="btn-retro" style="border-color: var(--accent);" onclick="loginAdmin()"><i class="fa-solid fa-key"></i> ADMIN</button>
    </div>
  </header>

  <div class="container">

    <div class="sorra-panel" id="sorraPanel">
      <h3>[SORRA_PANEL // ADMIN_ACCESS]</h3>
      <p style="font-size: 0.85rem; margin-bottom: 15px;">Control Panel for Sorra K only.</p>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button class="btn-retro" onclick="changeSiteLogo()">CHANGE LOGO</button>
        <button class="btn-retro" onclick="changeAvatar()">CHANGE AVATAR</button>
        <button class="btn-retro" onclick="changeBgColor()">CHANGE RETRO BG</button>
      </div>
    </div>

    <div class="post-card">
      <div class="post-header">
        <img src="IMG_1903 (1).PNG" class="author-avatar site-avatar-img" alt="Avatar">
        <div class="post-author-info">
          <h4>Sorra K <i class="fa-solid fa-circle-check" style="color: var(--accent);"></i></h4>
          <span>@sorra_works • Chapter 1 Release</span>
        </div>
      </div>

      <div class="post-content">
        <p>> CHAPTER 1: A NEW BEGINNING [PAGE 1]</p>
        <img src="IMG_1903 (1).PNG" class="manga-page-img" alt="Manga Page">
      </div>

      <div class="action-bar">
        <button class="like-btn" onclick="addHeart(this)"><i class="fa-regular fa-heart"></i> <span>15</span> HEARTS</button>
        <button class="like-btn" onclick="addHeart(this)"><i class="fa-regular fa-thumbs-up"></i> <span>8</span> LIKES</button>
      </div>

      <div class="comments-container">
        <p style="font-size: 0.85rem; margin-bottom: 10px; color: var(--text-muted);">> PAGE COMMENTS:</p>
        <ul class="comment-list" id="comments-page-1">
          <li class="comment-item"><strong>Reader_01:</strong> Awesome art style!</li>
          <li class="comment-item"><strong>RetroFan:</strong> Love the retro vibes ❤️</li>
        </ul>

        <div class="comment-box">
          <input type="text" class="comment-input" id="input-page-1" placeholder="Type a comment...">
          <button class="btn-retro" onclick="postComment('comments-page-1', 'input-page-1')">SEND</button>
        </div>
      </div>
    </div>

  </div>

  <footer>
    <p>© SORRA WORKS // SYSTEM STATUS: ONLINE</p>
  </footer>

  <script>
    // Theme Switcher (Light / Dark Retro)
    function toggleTheme() {
      const body = document.documentElement;
      if (body.getAttribute('data-theme') === 'light') {
        body.setAttribute('data-theme', 'dark');
      } else {
        body.setAttribute('data-theme', 'light');
      }
    }

    // Admin Login for Sorra Panel
    function loginAdmin() {
      const pass = prompt("ENTER ADMIN KEY:");
      if (pass === "sorra123") {
        alert("WELCOME SORRA K. ACCESS GRANTED.");
        document.getElementById('sorraPanel').style.display = 'block';
      } else if (pass !== null) {
        alert("ACCESS DENIED.");
      }
    }

    // Admin Functions
    function changeSiteLogo() {
      const img = prompt("Enter Logo Image File Name:");
      if (img) document.getElementById('siteLogoImg').src = img;
    }

    function changeAvatar() {
      const img = prompt("Enter Avatar Image File Name:");
      if (img) {
        document.querySelectorAll('.site-avatar-img').forEach(el => el.src = img);
      }
    }

    function changeBgColor() {
      const color = prompt("Enter Retro Background Hex Code (e.g., #050508):");
      if (color) document.documentElement.style.setProperty('--bg-primary', color);
    }

    // Reader Interaction: Likes/Hearts
    function addHeart(btn) {
      const count = btn.querySelector('span');
      let val = parseInt(count.textContent);
      if (!btn.classList.contains('active')) {
        btn.classList.add('active');
        btn.querySelector('i').className = 'fa-solid fa-heart';
        count.textContent = val + 1;
      } else {
        btn.classList.remove('active');
        btn.querySelector('i').className = 'fa-regular fa-heart';
        count.textContent = val - 1;
      }
    }

    // Reader Interaction: Comments under each page
    function postComment(listId, inputId) {
      const input = document.getElementById(inputId);
      const text = input.value.trim();
      if (text !== "") {
        const ul = document.getElementById(listId);
        const li = document.createElement('li');
        li.className = 'comment-item';
        li.innerHTML = `<strong>Viewer:</strong> ${text}`;
        ul.appendChild(li);
        input.value = "";
      }
    }
  </script>

</body>
</html>
