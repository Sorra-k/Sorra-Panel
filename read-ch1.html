<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter 1 - My First Manga</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0c;
      --bg-card: #141418;
      --accent: #ff4757;
      --text-main: #f1f2f6;
      --text-muted: #a4b0be;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Navigation Bar */
    .nav-bar {
      width: 100%;
      background: rgba(20, 20, 24, 0.95);
      backdrop-filter: blur(8px);
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #22222a;
    }

    .nav-bar a {
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .nav-bar a:hover {
      color: var(--accent);
    }

    .chapter-title {
      font-size: 1rem;
      font-weight: 600;
    }

    /* Reader Container */
    .reader-container {
      max-width: 800px;
      width: 100%;
      margin: 20px auto;
      background: var(--bg-card);
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    .manga-image {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Comments Wrapper */
    .comments-wrapper {
      max-width: 800px;
      width: 100%;
      margin: 20px auto 50px;
      padding: 25px;
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid #22222a;
    }

    .comments-header {
      font-size: 1.2rem;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #22222a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Home</a>
    <span class="chapter-title">Chapter 1</span>
    <span style="width: 70px;"></span>
  </div>

  <div class="reader-container">
    <img src="IMG_1903 (1).PNG" alt="Page 1" class="manga-image">
    </div>

  <div class="comments-wrapper">
    <div class="comments-header">
      <i class="fa-regular fa-comments"></i> Reader Discussion
    </div>
    
    <div id="giscus"></div>
  </div>

</body>
</html>
